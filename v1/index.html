<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis | 相棒コンソール</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="../shared/console.css">
  <script src="../shared/theme.js"></script>
  <script defer src="../shared/assistant.js"></script>
</head>
<body>
  <header class="mast">
    <a class="wordmark" href="../" aria-label="Jarvis ポータルへ">
      <span class="sigil" aria-hidden="true">◈</span> Jarvis
    </a>
    <div class="mast-actions">
      <a class="back" href="../">← ポータル</a>
      <fieldset class="theme-picker">
        <legend class="sr-only">表示テーマ</legend>
        <label><input type="radio" name="jarvis-theme" value="light"><span>Light</span></label>
        <label><input type="radio" name="jarvis-theme" value="dark"><span>Dark</span></label>
        <label><input type="radio" name="jarvis-theme" value="auto" checked><span>Auto</span></label>
      </fieldset>
    </div>
  </header>
  <main class="workspace">
    <div class="desk-heading">
      <h1>相棒コンソール</h1>
      <span class="edition">JARVIS / V1</span>
    </div>
    <div class="desk">
      <section class="dialogue pane" aria-labelledby="chat-title">
        <div class="pane-heading"><h2 id="chat-title">対話</h2><button type="button" class="quiet" id="clear-chat">会話を消去</button></div>
        <div class="chat-body">
          <div class="opening">
            <div class="core-field" aria-hidden="true"><div class="orbit"><i></i></div></div>
            <h3>今日は、何から考えますか。</h3>
            <p>気になっている仕事や、まだ言葉になっていない考えをどうぞ。</p>
          </div>
          <div id="transcript" role="log" aria-label="会話履歴" aria-live="polite"></div>
        </div>
        <div class="compose-area">
          <div class="commands" aria-label="相談の例">
            <button type="button" data-prompt="仕事を整理したい。抱えていることと期限を書き出して、優先順位を考えたい。">仕事を整理</button>
            <button type="button" data-prompt="資料をレビューしたい。読み手と伝えたいことを整理し、根拠が必要な箇所を確認したい。">資料をレビュー</button>
            <button type="button" data-prompt="次の一歩を決めたい。判断材料と、今日小さく試せることを整理したい。">次の一歩を決める</button>
          </div>
          <form id="composer">
            <label class="sr-only" for="message">相談内容</label>
            <textarea id="message" rows="3" required placeholder="Jarvisに相談する…"></textarea>
            <div class="send-row"><button type="submit" id="send">送信 <span aria-hidden="true">↗</span></button></div>
          </form>
        </div>
      </section>
      <aside class="side" aria-label="対話の設定">
        <section class="pane tool-pane">
          <h2>応答モード</h2>
          <p id="model-status" role="status">整理モードを使用できます。</p>
          <button type="button" id="load-model">端末内AIを有効にする</button>
          <p class="hint">初回は数百MBのモデルをダウンロードします。WebGPU対応ブラウザで利用できます。</p>
        </section>
        <section class="pane tool-pane">
          <h2><label for="context">文脈メモ</label></h2>
          <p class="hint">相談の背景や大事にしたい条件を添えられます。</p>
          <textarea id="context" rows="4" placeholder="例：読み手は営業チーム。金曜までに方針を決めたい。"></textarea>
          <label class="remember"><input type="checkbox" id="remember"> 会話とメモをこの端末に保存</label>
        </section>
      </aside>
    </div>
    <!-- ORIGAMI -->
  </main>
</body>
</html>
